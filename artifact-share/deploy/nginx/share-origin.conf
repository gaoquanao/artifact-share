# 泛域名静态源站(方案二):用户/CDN → 本机 Nginx → OSS
# 放到 /etc/nginx/conf.d/share-origin.conf
#
# 链路:https://{slug}.s.example.com/*  →  OSS 对象 s/{slug}/*
# Nginx 按 $host 提取 slug,把请求改写到 OSS 的对应前缀上。
# OSS bucket 用"公共读"权限(本方案 Nginx 无法对私有桶签名);
# 私有桶 + 自动签名请用方案一(CDN 直接回源 OSS,开启私有 Bucket 回源)。

# $host 提取 slug,必须放在 http 上下文(conf.d 下的文件会被 include 进 http 块)
map $host $share_slug {
    default "";
    ~^(?<slug>[a-z0-9][a-z0-9-]{1,40})\.s\.example\.com$ $slug;
}

server {
    listen 80;
    server_name *.s.example.com;

    # 若不走 CDN、由本机直接对公网提供 HTTPS,需泛域名证书(Let's Encrypt DNS-01 可免签发):
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate     /etc/nginx/certs/wildcard.s.example.com.pem;
    # ssl_certificate_key /etc/nginx/certs/wildcard.s.example.com.key;

    access_log /var/log/nginx/share-origin.access.log;

    # 裸域 s.example.com 等未匹配到 slug 的请求直接 404,防止穿透
    if ($share_slug = "") {
        return 404;
    }

    location / {
        # /            → /s/{slug}/index.html
        # /assets/a.js → /s/{slug}/assets/a.js(query string 由 rewrite 自动透传)
        rewrite ^/$      /s/$share_slug/index.html break;
        rewrite ^/(.*)$  /s/$share_slug/$1        break;

        # 公共读 bucket:同地域建议用内网 endpoint(oss-cn-xxx-internal.aliyuncs.com),回源流量免公网费
        proxy_pass http://artifact-share.oss-cn-hangzhou-internal.aliyuncs.com;
        proxy_set_header Host artifact-share.oss-cn-hangzhou-internal.aliyuncs.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 对象不存在时返回友好 404 页,而不是 OSS 的 XML
        proxy_intercept_errors on;
        error_page 404 = @notfound;
    }

    location @notfound {
        default_type text/html;
        return 404 '<!doctype html><meta charset="utf-8"><body style="font-family:sans-serif;text-align:center;padding-top:80px"><h1>404</h1><p>分享内容不存在或已被下线。</p></body>';
    }
}
