# 发布 API 反向代理:api.example.com → Spring Boot(127.0.0.1:8080)
# 放到 /etc/nginx/conf.d/share-api.conf
upstream artifact_share_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;   # 换成你的 API 域名(DNS: api A 记录 → 服务器 IP)

    # 生产建议启用 443(用 certbot 签发):
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate     /etc/nginx/certs/api.example.com.pem;
    # ssl_certificate_key /etc/nginx/certs/api.example.com.key;

    # 与 spring.servlet.multipart.max-request-size 对齐,给产物上传留余量
    client_max_body_size 120m;

    location / {
        proxy_pass http://artifact_share_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
